<!-- Firebase se carga antes de ejecutar la aplicación -->
<script>
(function(){
    const sources = [
        "https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js",
        "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js",
        "https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js",
        "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"
    ];

    const fallbackSources = [
        "https://cdn.jsdelivr.net/npm/firebase@10.14.1/compat/firebase-app.js",
        "https://cdn.jsdelivr.net/npm/firebase@10.14.1/compat/firebase-auth.js",
        "https://cdn.jsdelivr.net/npm/firebase@10.14.1/compat/firebase-database.js",
        "https://cdn.jsdelivr.net/npm/firebase@10.14.1/compat/firebase-firestore.js"
    ];

    function loadScript(url){
        return new Promise((resolve,reject)=>{
            const script=document.createElement("script");
            script.src=url;
            script.onload=resolve;
            script.onerror=()=>reject(new Error("No se pudo cargar "+url));
            document.head.appendChild(script);
        });
    }

    async function loadAll(){
        for(let i=0;i<sources.length;i++){
            try{
                await loadScript(sources[i]);
            }catch(firstError){
                try{
                    await loadScript(fallbackSources[i]);
                }catch(secondError){
                    throw secondError;
                }
            }
        }

        if(!window.firebase) throw new Error("Firebase no está disponible.");
        startGarden();
    }

    loadAll().catch(error=>{
        console.error(error);
        const message=document.createElement("div");
        message.style.cssText="position:fixed;z-index:9999;bottom:12px;left:12px;right:12px;padding:15px;background:#180909;border:1px solid #633;color:#ddd;font:12px monospace;line-height:1.7";
        message.textContent="No se pudieron cargar las librerías de Firebase. Comprueba la conexión o si el navegador bloquea los servidores de Firebase.";
        document.body.appendChild(message);
    });
})();

function startPresence(user){
    const connectedRef=database.ref(".info/connected");
    const myPresence=database.ref("presence/"+user.uid);

    connectedRef.on("value",snapshot=>{
        if(snapshot.val()!==true)return;
        myPresence.onDisconnect().remove()
        .then(()=>myPresence.set(true))
        .catch(error=>console.error("Error de presencia:",error));

        const msg=document.getElementById("guest-message-input").value.trim();
        const submit=document.getElementById("guest-submit");
        const status=document.getElementById("guest-status");

        if(name.length<2||name.length>24||msg.length<1||msg.length>500){
            status.textContent="Revisa el alias y el mensaje.";
            return;
        }
        submit.disabled=true;
        status.textContent="Registrando firma...";
        try{
            await database.ref("guestbook").push({
                name,msg,ts:firebase.database.ServerValue.TIMESTAMP
            });
            event.target.reset();
            status.textContent="Tu firma ha quedado registrada.";
        }catch(error){
            console.error(error);
            status.textContent="No se pudo registrar. Inténtalo de nuevo.";
        }finally{submit.disabled=false}
    });

    if(!guestbookStarted){
        guestbookStarted=true;
        database.ref("guestbook").orderByChild("ts").on("value",renderGuestbook,error=>{
            console.error(error);
            const list=document.getElementById("guest-list");
            if(list)list.textContent="No se pudieron cargar las firmas.";
        });
    }else{
        database.ref("guestbook").orderByChild("ts").once("value").then(renderGuestbook);
    }
}

function renderGuestbook(snapshot){
    const list=document.getElementById("guest-list");
    if(!list)return;
    list.innerHTML="<div class='guest-label'>REGISTROS DE VISITANTES</div>";

    if(!snapshot.exists()){
        const empty=document.createElement("p");
        empty.className="admin-status";
        empty.textContent="Todavía no hay firmas.";
        list.appendChild(empty);
        return;
    }

    const entries=[];
    snapshot.forEach(child=>entries.push({id:child.key,...child.val()}));
    entries.reverse();

    entries.forEach(entry=>{
        const article=document.createElement("article");
        article.className="guest-post";
        const name=document.createElement("div");
        name.className="guest-post-name";
        name.textContent=entry.name||"Visitante";
        const message=document.createElement("div");
        message.className="guest-post-message";
        message.textContent=entry.msg||"";
        const date=document.createElement("div");
        date.className="guest-post-date";
        date.textContent=entry.ts?new Date(entry.ts).toLocaleString("es-EC"):"";
        article.append(name,message,date);

        if(currentUser&&currentUser.uid===ADMIN_UID){
            const remove=document.createElement("button");
            remove.className="admin-button admin-danger";
            remove.textContent="ELIMINAR FIRMA";
            remove.style.marginTop="12px";
            remove.addEventListener("click",async()=>{
                if(confirm("¿Eliminar esta firma?")){
                    try{await database.ref("guestbook/"+entry.id).remove()}
                    catch(error){alert("No se pudo eliminar: "+error.message)}
                }
            });
            article.appendChild(remove);
        }
        list.appendChild(article);
    });
}

/* PUBLICACIONES: HTML SEGURO */

function safeHtml(html){
    const parser=new DOMParser();
    const doc=parser.parseFromString(String(html||""),"text/html");
    const allowed=["P","BR","B","STRONG","I","EM","U","A","UL","OL","LI"];
    function clean(parent){
        [...parent.childNodes].forEach(node=>{
            if(node.nodeType===Node.TEXT_NODE)return;
            if(node.nodeType!==Node.ELEMENT_NODE){
                node.remove();return;
            }
            if(!allowed.includes(node.tagName)){
                node.replaceWith(...node.childNodes);
                return;
            }
            [...node.attributes].forEach(attr=>{
                if(node.tagName!=="A"||!["href","target","rel"].includes(attr.name.toLowerCase())){
                    node.removeAttribute(attr.name);
                }
            });
            if(node.tagName==="A"){
                try{
                    const url=new URL(node.getAttribute("href"),location.href);
                    if(!["http:","https:","mailto:"].includes(url.protocol)){
                        node.replaceWith(...node.childNodes);
                        return;
                    }
                    node.setAttribute("target","_blank");
                    node.setAttribute("rel","noopener noreferrer");
                }catch(e){
                    node.replaceWith(...node.childNodes);
                    return;
                }
            }
            clean(node);
        });
    }
    clean(doc.body);
    return doc.body.innerHTML;
}

/* MOSTRAR UNA CATEGORÍA */

async function showCategory(section,title,description){
    closeMenus();
    saveData("gardenCategory",JSON.stringify({section,title,description}));

    if(section==="HOME"&&title==="Libro de visitas"){
        showGuestbook();return;
    }

    const content=document.getElementById("content-area");
    const token=++currentContentToken;
    content.innerHTML="";
    const heading=document.createElement("h2");
    heading.className="content-title";
    heading.textContent=title;
    const desc=document.createElement("p");
    desc.className="content-description";
    desc.textContent=description;
    content.append(heading,desc);

    const loading=document.createElement("p");
    loading.className="admin-status";
    loading.textContent="Consultando registros...";
    content.appendChild(loading);

    try{
        const snapshot=await firestore.collection("publicaciones")
            .where("menu","==",section)
            .where("category","==",title).get();

        if(token!==currentContentToken)return;
        loading.remove();

        const docs=[];
        snapshot.forEach(doc=>docs.push({id:doc.id,...doc.data()}));
        docs.sort((a,b)=>{
            const ta=a.createdAt?.toMillis?.()||0;
            const tb=b.createdAt?.toMillis?.()||0;
            return tb-ta;
        });

        if(!docs.length){
            const empty=document.createElement("p");
            empty.className="admin-status";
            empty.textContent="No hay publicaciones en esta sección.";
            content.appendChild(empty);
        }

        docs.forEach(item=>{
            const article=document.createElement("article");
            article.className="publication";
            const h=document.createElement("h3");
            h.textContent=item.title||"Sin título";
            const body=document.createElement("div");
            body.className="publication-body";
            body.innerHTML=safeHtml(item.bodyHtml||"");
            article.append(h,body);
            content.appendChild(article);
        });

        const files=await firestore.collection("archivos")
            .where("menu","==",section)
            .where("category","==",title).get();

        if(token!==currentContentToken)return;
        files.forEach(doc=>{
            const item=doc.data();
            const article=document.createElement("article");
            article.className="publication";
            const h=document.createElement("h3");
            h.textContent=item.title||"Archivo";
            const p=document.createElement("p");
            p.className="publication-body";
            p.textContent=item.description||"";
            const a=document.createElement("a");
            a.href=item.url||"#";
            a.target="_blank";
            a.rel="noopener noreferrer";
            a.textContent=item.linkLabel||"Abrir archivo";
            article.append(h,p,a);
            content.appendChild(article);
        });

    }catch(error){
        console.error("Error cargando contenido:",error);
        if(token===currentContentToken){
            loading.textContent="No se pudo cargar el contenido. Comprueba las reglas de Firestore.";
        }
    }
}

function restoreCategory(){
    const saved=getSaved("gardenCategory");
    if(!saved){showHome();return}
    try{
        const data=JSON.parse(saved);
        if(data.section==="HOME"&&!data.title){showHome();return}
        const valid=sections[data.section]?.find(item=>item.title===data.title);
        if(valid)showCategory(data.section,valid.title,valid.description);
        else showHome();
    }catch(e){showHome()}

/* CARTA DE ENTRADA */

function typeWriter(){
    if(typingStarted)return;
    typingStarted=true;
    const message=messages[Math.floor(Math.random()*messages.length)]+signature;
    const textElement=document.getElementById("typed-text");
    const cursor=document.getElementById("cursor");
    let index=0;
    function type(){
        if(index<message.length){
            const character=message.charAt(index);
            textElement.textContent+=character;
            index++;
            setTimeout(type,character==="\n"?350:32);
        }else{
            cursor.style.display="none";
            setTimeout(showHomeScreen,2500);
        }
    }
    type();
}
function showHomeScreen(){
    if(transitionStarted)return;
    transitionStarted=true;
    const letter=document.getElementById("letter-screen");
    const home=document.getElementById("home-screen");
    letter.style.opacity="0";
    setTimeout(()=>{
        letter.style.display="none";
        home.style.display="block";
        setTimeout(()=>home.style.opacity="1",100);
        saveData("gardenEntered","yes");
        restoreCategory();
    },1500);
}
function initializePage(){
    if(getSaved("gardenEntered")==="yes"){
        document.getElementById("letter-screen").style.display="none";
        const home=document.getElementById("home-screen");
        home.style.display="block";

        restoreCategory();
    }else typeWriter();
}

function editorToolbar(){
    return `
    <div class="editor-toolbar">
        <button type="button" data-command="bold"><b>B</b></button>
        <button type="button" data-command="italic"><i>I</i></button>
        <button type="button" data-command="underline"><u>U</u></button>
        <button type="button" data-command="insertUnorderedList">LISTA</button>
        <button type="button" id="insert-link">INSERTAR LINK</button>
        <button type="button" id="remove-link">QUITAR LINK</button>
    </div>
    <div class="editor-help">Selecciona una palabra o frase dentro del contenido y pulsa INSERTAR LINK. Después introduce la dirección web.</div>
    <div class="rich-editor" id="rich-editor" contenteditable="true" spellcheck="true"></div>`;
}
function setupEditor(initialHtml=""){
    const editor=document.getElementById("rich-editor");
    editor.innerHTML=safeHtml(initialHtml);

    document.querySelectorAll("[data-command]").forEach(button=>{
        button.addEventListener("click",()=>{
            editor.focus();
            document.execCommand(button.dataset.command,false,null);
        });
    });

    document.getElementById("insert-link").addEventListener("click",()=>{
        editor.focus();
        const selection=window.getSelection();
        if(!selection||selection.isCollapsed){
            alert("Primero selecciona la palabra o frase que quieres convertir en enlace.");
            return;
        }
        const raw=prompt("Introduce la dirección del enlace (https://...)");
        if(!raw)return;
        let url;
        try{url=new URL(raw.trim())}
        catch(e){alert("La dirección no es válida.");return}
        if(!["http:","https:","mailto:"].includes(url.protocol)){
            alert("Solo se permiten enlaces http, https o mailto.");
            return;
        }
        document.execCommand("createLink",false,url.href);
        editor.querySelectorAll("a").forEach(a=>{
            a.target="_blank";
            a.rel="noopener noreferrer";
        });
    });

    document.getElementById("remove-link").addEventListener("click",()=>{
        editor.focus();
        document.execCommand("unlink",false,null);
    });
}

function renderPublicationEditor(editData=null){
    const panel=document.getElementById("admin-panel-content");
    const menu=editData?.menu||"HOME";
    const category=editData?.category||sections[menu][0].title;

    panel.innerHTML=`
    <div class="admin-box">
        <p class="admin-subtitle">${editData?"EDITAR PUBLICACIÓN":"NUEVA PUBLICACIÓN"}</p>
        ${addLocationSelectors(menu,category)}
        <label class="admin-status">TÍTULO</label>
        <input class="admin-input" id="record-title" maxlength="120" placeholder="Título de la publicación">
        <label class="admin-status">CONTENIDO</label>
        ${editorToolbar()}
        <div class="admin-actions">
            <button class="admin-button" id="record-save">${editData?"GUARDAR CAMBIOS":"PUBLICAR"}</button>
            <button class="admin-button" id="record-cancel">CANCELAR</button>
        </div>
        <p class="admin-status" id="record-status"></p>
    </div>
    <div class="admin-box">
        <p class="admin-subtitle">PUBLICACIONES EXISTENTES</p>
        <div id="record-list" class="admin-status">Cargando...</div>
    </div>`;

    const menuSelect=document.getElementById("record-menu");
    const categorySelect=document.getElementById("record-category");
    menuSelect.addEventListener("change",()=>fillCategorySelect(menuSelect,categorySelect));

    setupEditor(editData?.bodyHtml||"");
    if(editData)document.getElementById("record-title").value=editData.title||"";

    document.getElementById("record-cancel").addEventListener("click",()=>{
        editingId=null;editingCollection=null;renderPublicationEditor();
    });

    document.getElementById("record-save").addEventListener("click",async()=>{
        const title=document.getElementById("record-title").value.trim();
        const bodyHtml=safeHtml(document.getElementById("rich-editor").innerHTML);
        const status=document.getElementById("record-status");
        if(!title||!document.getElementById("rich-editor").textContent.trim()){
            status.textContent="Escribe un título y contenido.";
            return;
        }
        const data={
            menu:menuSelect.value,
            category:categorySelect.value,
            title,
            bodyHtml,
            updatedAt:firebase.firestore.FieldValue.serverTimestamp()
        };
        try{
            if(editingId){
                await firestore.collection("publicaciones").doc(editingId).update(data);
                status.textContent="Publicación actualizada.";
            }else{
                data.createdAt=firebase.firestore.FieldValue.serverTimestamp();
                await firestore.collection("publicaciones").add(data);
                status.textContent="Publicación creada.";
            }
            editingId=null;
            editingCollection=null;
            renderPublicationEditor();
        }catch(error){
            console.error(error);
            status.textContent="No se pudo guardar. Comprueba las reglas de Firestore.";
        }
    });

    loadPublicationList();
}

async function loadPublicationList(){
    const list=document.getElementById("record-list");
    if(!list)return;
    try{
        const snapshot=await firestore.collection("publicaciones").get();
        if(!document.getElementById("record-list"))return;
        list.innerHTML="";
        if(snapshot.empty){list.textContent="No hay publicaciones todavía.";return}

        const docs=[];
        snapshot.forEach(doc=>docs.push({id:doc.id,...doc.data()}));
        docs.sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));

        docs.forEach(item=>{
            const row=document.createElement("div");
            row.className="admin-record";
            const label=document.createElement("span");
            label.textContent=`${item.menu||""} / ${item.category||""} — ${item.title||"Sin título"}`;

            const actions=document.createElement("div");
            actions.className="admin-actions";

            const edit=document.createElement("button");
            edit.textContent="EDITAR";
            edit.addEventListener("click",()=>{
                editingId=item.id;
                renderPublicationEditor(item);
            });

            const remove=document.createElement("button");
            remove.textContent="ELIMINAR";
            remove.className="admin-danger";
            remove.addEventListener("click",async()=>{
                if(!confirm("¿Eliminar esta publicación?"))return;
                try{
                    await firestore.collection("publicaciones").doc(item.id).delete();
                    loadPublicationList();
                }catch(error){alert("No se pudo eliminar.")}
            });

            actions.append(edit,remove);
            row.append(label,actions);
            list.appendChild(row);
        });
    }catch(error){
        console.error(error);
        list.textContent="No se pudieron cargar las publicaciones. Revisa las reglas de Firestore.";
    }
}

            const item={id:doc.id,...doc.data()};
            const row=document.createElement("div");
            row.className="admin-record";
            const label=document.createElement("span");
            label.textContent=`${item.menu||""} / ${item.category||""} — ${item.title||"Archivo"}`;
            const actions=document.createElement("div");
            actions.className="admin-actions";
            const edit=document.createElement("button");
            edit.textContent="EDITAR";
            edit.addEventListener("click",()=>{
                editingId=item.id;renderFileEditor(item);
            });
            const remove=document.createElement("button");
            remove.textContent="ELIMINAR";
            remove.className="admin-danger";
            remove.addEventListener("click",async()=>{
                if(!confirm("¿Eliminar este archivo?"))return;
                try{
                    await firestore.collection("archivos").doc(item.id).delete();
                    loadFileList();
                }catch(error){alert("No se pudo eliminar.")}
            });
            actions.append(edit,remove);
            row.append(label,actions);
            list.appendChild(row);
        });
    }catch(error){
        console.error(error);
        list.textContent="No se pudieron cargar los archivos. Revisa las reglas de Firestore.";
    }
}

/* CONFIGURACIÓN */

function renderConfiguration(){
    const panel=document.getElementById("admin-panel-content");
    panel.innerHTML=`
    <div class="admin-box">
        <p class="admin-subtitle">CONFIGURACIÓN DEL SITIO</p>
        <input class="admin-input" id="config-key" placeholder="Nombre de la opción">
        <textarea class="admin-textarea" id="config-value" placeholder="Valor"></textarea>
        <button class="admin-button" id="config-save">GUARDAR CONFIGURACIÓN</button>
        <p class="admin-status" id="config-status"></p>
        <div id="config-list" class="admin-status">Cargando...</div>
    </div>`;

    loadConfig();

    document.getElementById("config-save").addEventListener("click",async()=>{
        const key=document.getElementById("config-key").value.trim();
        const value=document.getElementById("config-value").value.trim();
        const status=document.getElementById("config-status");
        if(!key||!value){status.textContent="Completa ambos campos.";return}
        try{
            await firestore.collection("configuracion").doc(key).set({
                value,updatedAt:firebase.firestore.FieldValue.serverTimestamp()
            });
            status.textContent="Configuración guardada.";
            loadConfig();
        }catch(error){
            console.error(error);
            status.textContent="No se pudo guardar. Revisa las reglas de Firestore.";
        }
    });
}

async function loadConfig(){
    const list=document.getElementById("config-list");
    if(!list)return;
    try{
        const snapshot=await firestore.collection("configuracion").get();
        if(!document.getElementById("config-list"))return;
        list.innerHTML="";
        if(snapshot.empty){list.textContent="No hay opciones guardadas.";return}
        snapshot.forEach(doc=>{
            const row=document.createElement("div");
            row.className="admin-record";
            const label=document.createElement("span");
            label.textContent=doc.id+": "+(doc.data().value||"");
            const remove=document.createElement("button");
            remove.textContent="ELIMINAR";
            remove.addEventListener("click",async()=>{
                if(!confirm("¿Eliminar esta configuración?"))return;
                try{
                    await firestore.collection("configuracion").doc(doc.id).delete();
                    loadConfig();
                }catch(error){alert("No se pudo eliminar.")}
            });
            row.append(label,remove);
            list.appendChild(row);
        });
    }catch(error){
        console.error(error);
        list.textContent="No se pudo cargar la configuración. Revisa las reglas de Firestore.";
    }
}

/* INICIO */

initializePage();

}
</script>
